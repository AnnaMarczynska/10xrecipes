name: Build & Deploy to Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE_NAME: 10x-recipes
  SERVICE_NAME: 10x-recipes-api
  REGION: us-central1
  PROJECT_ID: tenx-recipes

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.PROJECT_ID }}
          # Use Workload Identity Federation (recommended)
          # If using service account key, use: service_account_key: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker to use gcloud
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest \
                       .

      - name: Push image to Artifact Registry
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only deploy on push to main, skip for pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --max-instances 100 \
            --set-env-vars \
              SPRING_DATASOURCE_URL="jdbc:postgresql://$(gcloud sql instances describe recipes-db --format='value(ipAddresses[0].ipAddress)'):5432/recipes_db" \
              SPRING_DATASOURCE_USERNAME=recipes_user \
              SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQL10Dialect \
            --set-secrets \
              SPRING_DATASOURCE_PASSWORD=db-password:latest \
              JWT_SECRET=jwt-secret:latest

      - name: Get Cloud Run service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          echo "Service deployed at: $SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Wait for service to be ready
        run: sleep 10

      - name: Smoke test - health check
        run: |
          SERVICE_URL=$(gcloud run services describe 10x-recipes-api \
            --region us-central1 \
            --project tenx-recipes \
            --format='value(status.url)')
          curl -f "$SERVICE_URL/actuator/health" || exit 1
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}

      - name: Smoke test - API endpoints
        run: |
          SERVICE_URL=$(gcloud run services describe 10x-recipes-api \
            --region us-central1 \
            --project tenx-recipes \
            --format='value(status.url)')
          # Test recipe search endpoint
          curl -f "$SERVICE_URL/api/recipes/search?ingredients=chicken&timeRange=30-60" || exit 1
