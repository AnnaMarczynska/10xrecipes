spring.application.name=10x-recipes

# H2 In-Memory Database (Development)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# JWT Configuration (secret key must be >= 256 bits / 32 bytes)
jwt.secret=this-is-a-very-secure-development-secret-key-for-jwt-testing-only-please-use-proper-secret-in-production
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

# Server Configuration
server.servlet.context-path=/api
