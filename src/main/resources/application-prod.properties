spring.application.name=10x-recipes

# PostgreSQL Database (Production)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/recipes}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.use_generated_keys=true

# JWT Configuration
# REQUIRED: Set via JWT_SECRET environment variable (minimum 256 bits / 32 bytes)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
# REQUIRED: Set via CORS_ALLOWED_ORIGINS environment variable
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Server Configuration
server.servlet.context-path=/api
server.port=${SERVER_PORT:8080}

# Security (HTTPS enforced in production)
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}

# Logging (reduced in production)
logging.level.root=INFO
logging.level.com.example._x_recipes=INFO
