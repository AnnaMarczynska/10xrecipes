spring:
  application:
    name: 10x-recipes-api

  # Cloud SQL PostgreSQL configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recipes_db}
    username: ${SPRING_DATASOURCE_USERNAME:recipes_user}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQL10Dialect
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  # Cloud Run environment
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Security & JWT
app:
  security:
    jwt:
      secret: ${JWT_SECRET:default-dev-secret-change-in-production}
      expiration: 86400000 # 24 hours in milliseconds

# Logging - structured for Cloud Logging
logging:
  level:
    root: INFO
    com.example._x_recipes: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} [%thread] %-5level %logger{36} - %msg%n"

# Actuator - health checks for Cloud Run
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# Server configuration
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: always
    include-binding-errors: always

# CORS for frontend
cors:
  allowed-origins:
    - "https://10x-recipes-api.run.app"
    - "http://localhost:5173"
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true
